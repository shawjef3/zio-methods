version = "3.11.5"
runner.dialect = scala213source3

maxColumn = 120

# Two spaces for wrapped parameter and argument lists, rather than scalafmt's
# default of four at the definition site.
indent.defnSite = 2
indent.callSite = 2
indent.ctorSite = 2
indent.extendSite = 2

# No alignment. Aligning a block of `:=` or `%%` ties each line's formatting to
# the width of its neighbors, so adding or renaming one entry reflows the whole
# block and turns a one-line change into a multi-line diff.
align.preset = none

# Only format files Git tracks, so build output and scratch files are skipped.
project.git = true

# Match the docstrings already in the tree: `/**` alone on its line, and
# continuation asterisks indented one space. `wrap = no` leaves prose alone,
# so scalafmt never reflows a paragraph someone wrapped deliberately.
docstrings.style = Asterisk
docstrings.oneline = keep
docstrings.wrap = no

rewrite.rules = [RedundantBraces, RedundantParens, SortModifiers]

# Access modifiers before `final`, per the Scala Style Guide. This is the order
# already used throughout the tree: `private[stream] final class`, not
# scalafmt's default of `final private[stream] class`.
rewrite.sortModifiers.preset = styleGuide

rewrite.redundantBraces.stringInterpolation = true
rewrite.redundantBraces.methodBodies = false

fileOverride {
  "glob:**/*.sbt" {
    runner.dialect = sbt1
  }
  "glob:**/project/**.scala" {
    runner.dialect = scala212source3
  }
}
